[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opfv"
version = "0.1.0"
description = "Off-policy evaluation and learning for the future under non-stationarity (KDD 2025)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "obp>=0.4.1",
    "omegaconf>=2.3.0",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "scikit-learn>=1.8.0",
    "scipy>=1.10.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "types-tqdm>=4.67.3.20260303",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[project.scripts]
opfv = "opfv.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opfv"]

[tool.hatch.build.targets.sdist]
include = ["src/opfv", "tests", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src/opfv", "tests"]
exclude = ["src/opfv/kuairec_fopl"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

# Sony-originated domain modules: keep behavior; relax style rules.
[tool.ruff.lint.per-file-ignores]
"src/opfv/domain/estimators.py" = ["E501", "E712", "UP035"]
"src/opfv/domain/regression_model_time.py" = ["E501", "UP035", "UP045"]
"src/opfv/domain/synthetic_bandit.py" = ["E501", "E712", "UP035", "UP045", "UP006", "I001"]
"src/opfv/domain/policy.py" = ["E501", "E712", "UP"]
"src/opfv/synthetic_fopl/settings.py" = ["E501", "UP035"]
"src/opfv/synthetic_fopl/opl.py" = ["E501", "E712", "UP035", "UP045", "E402", "I001"]
"src/opfv/synthetic_fopl/policylearners.py" = [
    "E501",
    "E712",
    "UP035",
    "UP045",
    "I001",
    "UP032",
]
"src/opfv/synthetic_fopl/utils.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true
packages = ["opfv"]

[[tool.mypy.overrides]]
module = [
    "opfv.domain.estimators",
    "opfv.domain.regression_model_time",
    "opfv.domain.synthetic_bandit",
    "opfv.domain.policy",
    "opfv.domain.obp_compat",
    "opfv.pipelines.ope",
    "opfv.synthetic_fopl.settings",
    "opfv.experiments.synthetic_opl",
    "opfv.synthetic_fopl.opl",
    "opfv.synthetic_fopl.policylearners",
    "opfv.synthetic_fopl.utils",
    "opfv.synthetic_fopl.plots",
    "opfv.kuairec_fopl.conf",
    "opfv.kuairec_fopl.help_show",
    "opfv.kuairec_fopl.opl",
    "opfv.kuairec_fopl.plots",
    "opfv.kuairec_fopl.policylearners",
    "opfv.kuairec_fopl.preprocess",
    "opfv.kuairec_fopl.regression_model_time",
    "opfv.kuairec_fopl.utils",
    "opfv.kuairec_fopl.utils_time",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: full synthetic OPE integration",
    "kuairec: requires KuaiRec CSV tree",
]
addopts = "-m \"not slow and not kuairec\""
