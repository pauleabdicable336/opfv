name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"

      - name: Sync environment
        run: uv sync --frozen --all-extras

      - name: Ruff check
        run: uv run ruff check src/opfv tests

      - name: Ruff format
        run: uv run ruff format --check src/opfv tests

      - name: Mypy
        run: uv run mypy src/opfv

      - name: Pytest (fast)
        run: uv run pytest
